<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Liquid Glass Navigation</title>

  <!-- Version : v1.0.0 -->

  <style>
    :root {
      --background: #090909;
      --glass-background: rgba(35, 35, 38, 0.72);
      --glass-border: rgba(255, 255, 255, 0.14);
      --active-background: rgba(255, 255, 255, 0.17);
      --text-color: #ffffff;
      --muted-color: rgba(255, 255, 255, 0.55);
      --accent-color: #ff9f0a;
      --nav-height: 74px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Inter, Arial, sans-serif;
      color: var(--text-color);
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 159, 10, 0.15), transparent 30%),
        radial-gradient(circle at 85% 25%, rgba(0, 122, 255, 0.15), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(175, 82, 222, 0.18), transparent 35%),
        var(--background);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255, 255, 255, 0.025) 45%,
          transparent 55%
        );
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px 140px;
    }

    .content {
      width: min(760px, 100%);
      text-align: center;
      animation: fadeIn 0.8s ease both;
    }

    .version {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.68);
      background: rgba(255, 255, 255, 0.06);
      font-size: 13px;
      letter-spacing: 0.04em;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .version::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 12px rgba(48, 209, 88, 0.85);
    }

    h1 {
      margin-bottom: 18px;
      font-size: clamp(42px, 8vw, 86px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      font-weight: 700;
      background: linear-gradient(
        120deg,
        #ffffff 15%,
        #c9c9cf 50%,
        #77777f 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .description {
      max-width: 580px;
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.62);
      font-size: 17px;
      line-height: 1.6;
    }

    .glass-nav {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 7px;
      width: max-content;
      max-width: calc(100% - 30px);
      padding: 8px;
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.025)
        ),
        var(--glass-background);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.13),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      animation: navAppear 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .glass-nav::before {
      content: "";
      position: absolute;
      top: 1px;
      left: 10%;
      right: 10%;
      height: 1px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      filter: blur(1px);
      pointer-events: none;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 58px;
      height: 56px;
      padding: 0 16px;
      border: 0;
      border-radius: 20px;
      color: var(--muted-color);
      background: transparent;
      cursor: pointer;
      font: inherit;
      transition:
        color 0.3s ease,
        background 0.3s ease,
        transform 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item:hover {
      color: var(--text-color);
      background: rgba(255, 255, 255, 0.09);
      transform: translateY(-2px);
    }

    .nav-item.active {
      color: var(--text-color);
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.22),
          rgba(255, 255, 255, 0.08)
        );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.17),
        0 4px 14px rgba(0, 0, 0, 0.18);
    }

    .nav-item.active .icon {
      color: var(--accent-color);
      filter: drop-shadow(0 0 7px rgba(255, 159, 10, 0.55));
    }

    .icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    .nav-label {
      max-width: 0;
      overflow: hidden;
      white-space: nowrap;
      opacity: 0;
      font-size: 14px;
      font-weight: 600;
      transition:
        max-width 0.35s ease,
        opacity 0.25s ease;
    }

    .nav-item.active .nav-label {
      max-width: 90px;
      opacity: 1;
    }

    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    @keyframes navAppear {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(30px) scale(0.92);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .page {
        padding-bottom: 125px;
      }

      .glass-nav {
        bottom: 17px;
        padding: 6px;
        border-radius: 24px;
      }

      .nav-item {
        min-width: 48px;
        width: 48px;
        height: 52px;
        padding: 0;
        border-radius: 18px;
      }

      .nav-item.active {
        width: auto;
        padding: 0 14px;
      }

      .nav-label {
        font-size: 13px;
      }

      .description {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content">
      <div class="version">Version v1.0.0</div>

      <div id="home" class="page-section active">
        <h1>Liquid Glass</h1>
        <p class="description">
          Une navigation flottante inspirée de l’interface Apple,
          avec transparence, flou et animations fluides.
        </p>
      </div>

      <div id="search" class="page-section">
        <h1>Recherche</h1>
        <p class="description">
          Retrouvez rapidement vos contenus favoris.
        </p>
      </div>

      <div id="favorites" class="page-section">
        <h1>Favoris</h1>
        <p class="description">
          Vos éléments enregistrés sont regroupés ici.
        </p>
      </div>

      <div id="profile" class="page-section">
        <h1>Profil</h1>
        <p class="description">
          Gérez votre compte et vos préférences.
        </p>
      </div>
    </section>
  </main>

  <nav class="glass-nav" aria-label="Navigation principale">
    <button class="nav-item active" data-target="home" aria-label="Accueil">
      <svg class="icon" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.8 12 3l9 7.8"></path>
        <path d="M5.5 9.5V21h13V9.5"></path>
        <path d="M9.5 21v-6h5v6"></path>
      </svg>
      <span class="nav-label">Accueil</span>
    </button>

    <button class="nav-item" data-target="search" aria-label="Recherche">
      <svg class="icon" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10.8" cy="10.8" r="6.8"></circle>
        <path d="m16 16 5 5"></path>
      </svg>
      <span class="nav-label">Recherche</span>
    </button>

    <button class="nav-item" data-target="favorites" aria-label="Favoris">
      <svg class="icon" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 20.5-1.45-1.32C5.4 14.52 2 11.43 2 7.65
          2 4.56 4.42 2.2 7.5 2.2c1.74 0 3.41.81 4.5 2.08
          1.09-1.27 2.76-2.08 4.5-2.08 3.08 0 5.5 2.36
          5.5 5.45 0 3.78-3.4 6.87-8.55 11.53L12 20.5Z">
        </path>
      </svg>
      <span class="nav-label">Favoris</span>
    </button>

    <button class="nav-item" data-target="profile" aria-label="Profil">
      <svg class="icon" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M4.5 21c.65-3.55 3.1-5.5 7.5-5.5s6.85 1.95 7.5 5.5"></path>
      </svg>
      <span class="nav-label">Profil</span>
    </button>
  </nav>

  <script>
    /*
      Liquid Glass Navigation
      Version : v1.0.0
    */

    const navigationItems = document.querySelectorAll(".nav-item");
    const sections = document.querySelectorAll(".page-section");

    navigationItems.forEach((item) => {
      item.addEventListener("click", () => {
        const targetId = item.dataset.target;

        navigationItems.forEach((navItem) => {
          navItem.classList.remove("active");
          navItem.setAttribute("aria-current", "false");
        });

        sections.forEach((section) => {
          section.classList.remove("active");
        });

        item.classList.add("active");
        item.setAttribute("aria-current", "page");

        const targetSection = document.getElementById(targetId);

        if (targetSection) {
          targetSection.classList.add("active");
        }
      });
    });
  </script>
</body>
</html>
